<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Carousel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="carousel">
    <div class="carousel-inner">
      <div class="slide active">
        <img src="https://picsum.photos/id/1015/800/450" alt="Slide 1" />
      </div>
      <div class="slide">
        <img src="https://picsum.photos/id/1016/800/450" alt="Slide 2" />
      </div>
      <div class="slide">
        <img src="https://picsum.photos/id/1018/800/450" alt="Slide 3" />
      </div>
      <div class="slide">
        <img src="https://picsum.photos/id/1025/800/450" alt="Slide 4" />
      </div>
    </div>

    <button class="prev">❮</button>
    <button class="next">❯</button>

    <div class="dots"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
